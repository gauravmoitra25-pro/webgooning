<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gojo — Direct Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;color:white;font-family:Arial,sans-serif}
  #loading{height:100%;display:grid;place-items:center;text-align:center}
  #loading div{padding:24px}
  .spin{width:28px;height:28px;border:3px solid #333;border-top-color:#67e8ff;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
  iframe{display:none;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div id="loading"><div><div class="spin"></div><b>Loading Gojo experience…</b><br><small>First load may take a few seconds.</small></div></div>
<iframe id="app"></iframe>
<script>
const RAW="https://raw.githubusercontent.com/Meghamittal0920/Gojo/master/index.html";
const BASE="https://raw.githubusercontent.com/Meghamittal0920/Gojo/master/";
(async()=>{
  try{
    const r=await fetch(RAW,{cache:"no-store"});
    if(!r.ok) throw new Error("Could not fetch project");
    let t=await r.text();
    // Make all relative images/videos/files resolve to the GitHub repository.
    t=t.replace(/<head([^>]*)>/i,'<head$1><base href="'+BASE+'">');
    const f=document.getElementById("app");
    f.srcdoc=t;
    f.onload=()=>{document.getElementById("loading").style.display="none";f.style.display="block"};
  }catch(e){
    document.getElementById("loading").innerHTML =
      '<div><h2>Could not load</h2><p>Please open this file while connected to the internet.</p><p>'+e.message+'</p></div>';
  }
})();
</script>
</body>
</html>
